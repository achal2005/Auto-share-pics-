# =============================================================================
# AutoSharePics — Docker Compose (development / single-host)
# =============================================================================
# Hardened from the original audit:
#   - Evolution API now built from evolution/Dockerfile with the WSL2 patch
#     baked in (no fragile `sed` command).
#   - n8n basic-auth wired to N8N_AUTH_USER/PASSWORD from .env.
#   - All `:?` env-var-required guards on every secret (no silent defaults).
#   - Healthchecks on every service that has a meaningful one.
#   - Resource limits via deploy.resources (honored on Docker 23+).
#   - CompreFace admin/API stay on compreface_net only — no host exposure.
#   - PostgreSQL no longer publishes to host by default; uncomment for debug.
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f evolution-api
# =============================================================================

volumes:
  n8n_data:
  app_postgres_data:
  compreface_postgres_data:
  evolution_instances:
  evolution_store:
  media_cache:

networks:
  autoshare_net:
    driver: bridge
  compreface_net:
    driver: bridge
    internal: true   # CompreFace cluster has no path to the internet

services:
  # =========================================================================
  # APPLICATION DATABASE
  # =========================================================================
  app-postgres:
    image: postgres:16-alpine
    container_name: autoshare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${APP_DB_USER:?Set APP_DB_USER in .env}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      POSTGRES_DB: ${APP_DB_NAME:?Set APP_DB_NAME in .env}
      TZ: ${TIMEZONE:-Asia/Kolkata}
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Host port closed by default. Uncomment for local DB tooling:
    # ports:
    #   - "127.0.0.1:${APP_DB_PORT:-5433}:5432"
    networks:
      - autoshare_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # =========================================================================
  # n8n — workflow engine
  # =========================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.70.0
    container_name: autoshare-n8n
    restart: unless-stopped
    depends_on:
      app-postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: app-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${APP_DB_NAME}
      DB_POSTGRESDB_USER: ${APP_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${APP_DB_PASSWORD}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      # Wire basic auth — the .env values were ignored before this audit.
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_AUTH_USER:?Set N8N_AUTH_USER in .env}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_AUTH_PASSWORD:?Set N8N_AUTH_PASSWORD in .env}
      # Encryption key for stored credentials. NEVER let n8n auto-generate
      # this in prod — losing it bricks every credential.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env (openssl rand -hex 32)}
      # Privacy/disk: prune old executions instead of keeping forever.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"        # hours == 7 days
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
      EXECUTIONS_MODE: regular
      EXECUTIONS_TIMEOUT: 600
      EXECUTIONS_TIMEOUT_MAX: 1200
      N8N_USER_FOLDER: /home/node
      GENERIC_TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      TZ: ${TIMEZONE:-Asia/Kolkata}
      # Required modules for inline JS in workflow Function nodes
      NODE_FUNCTION_ALLOW_EXTERNAL: "axios,form-data,heic-convert,fluent-ffmpeg,exifreader"
      N8N_METRICS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - media_cache:/home/node/media_cache
    ports:
      - "${N8N_PORT:-5678}:5678"
    networks:
      - autoshare_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz | grep -q ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # =========================================================================
  # CompreFace cluster (face recognition)
  # =========================================================================
  compreface-postgres:
    image: postgres:13-alpine
    container_name: autoshare-compreface-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CF_DB_USER:?Set CF_DB_USER in .env}
      POSTGRES_PASSWORD: ${CF_DB_PASSWORD:?Set CF_DB_PASSWORD in .env}
      POSTGRES_DB: frs
    volumes:
      - compreface_postgres_data:/var/lib/postgresql/data
    networks:
      - compreface_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CF_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  compreface-core:
    image: exadel/compreface-core:1.2.0
    container_name: autoshare-compreface-core
    restart: unless-stopped
    environment:
      ML_PORT: 3000
      IMG_LENGTH_LIMIT: ${CF_IMG_LIMIT:-1024}   # was 640 — too low for group photos
      UWSGI_PROCESSES: ${CF_UWSGI_PROCESSES:-2}
      UWSGI_THREADS: ${CF_UWSGI_THREADS:-1}
    networks:
      - compreface_net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  compreface-api:
    image: exadel/compreface-api:1.2.0
    container_name: autoshare-compreface-api
    restart: unless-stopped
    depends_on:
      compreface-postgres:
        condition: service_healthy
      compreface-core:
        condition: service_started
    environment:
      POSTGRES_URL: jdbc:postgresql://compreface-postgres:5432/frs
      POSTGRES_USER: ${CF_DB_USER}
      POSTGRES_PASSWORD: ${CF_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: dev
      API_JAVA_OPTS: "-Xmx1g"
      SAVE_IMAGES_TO_DB: "true"
      CONNECTION_TIMEOUT: 10000
      READ_TIMEOUT: 60000
    networks:
      - compreface_net
    deploy:
      resources:
        limits:
          memory: 1.5G

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    container_name: autoshare-compreface-admin
    restart: unless-stopped
    depends_on:
      compreface-api:
        condition: service_started
    environment:
      POSTGRES_URL: jdbc:postgresql://compreface-postgres:5432/frs
      POSTGRES_USER: ${CF_DB_USER}
      POSTGRES_PASSWORD: ${CF_DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: dev
      ADMIN_JAVA_OPTS: "-Xmx512m"
    networks:
      - compreface_net
      - autoshare_net
    deploy:
      resources:
        limits:
          memory: 768M

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    container_name: autoshare-compreface-fe
    restart: unless-stopped
    depends_on:
      - compreface-api
      - compreface-admin
    ports:
      - "127.0.0.1:${CF_API_PORT:-8000}:80"   # bind to loopback only
    environment:
      - PROXY_READ_TIMEOUT=60000
      - PROXY_CONNECT_TIMEOUT=60000
      - CLIENT_MAX_BODY_SIZE=10m
    networks:
      - compreface_net
      - autoshare_net
    deploy:
      resources:
        limits:
          memory: 256M

  # =========================================================================
  # Evolution API — WhatsApp gateway (WSL2-patched build)
  # =========================================================================
  evolution-api:
    build:
      context: .
      dockerfile: evolution/Dockerfile
    image: autoshare/evolution:wsl2
    container_name: autoshare-evolution
    restart: unless-stopped
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      SERVER_TYPE: http
      SERVER_PORT: 8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Set EVOLUTION_API_KEY in .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      LOG_LEVEL: "ERROR,WARN,INFO,LOG"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@app-postgres:5432/${EVOLUTION_DB_NAME:-evolution_api}
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: 6
      SEND_MESSAGE_TIMEOUT: 3000
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"   # required for instance restart on v2.x
      TZ: ${TIMEZONE:-Asia/Kolkata}
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
      - media_cache:/evolution/media_cache:ro
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    networks:
      - autoshare_net
    depends_on:
      app-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ | grep -qi 'evolution' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
